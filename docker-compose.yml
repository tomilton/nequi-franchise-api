version: '3.8'

services:
  api:
    image: miltonsanchez/nequi-franchise-api:latest
    container_name: nequi-franchise-api
    ports:
      - "8080:8080"
    environment:
      # R2DBC apunta al nombre del servicio (mysql)
      SPRING_R2DBC_URL: r2dbc:mysql://nequi-franchise.c0niimgysyda.us-east-1.rds.amazonaws.com:3306/nequi_franchise
      SPRING_R2DBC_USERNAME: root
      SPRING_R2DBC_PASSWORD: root1234
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - nequi-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:

networks:
  nequi-network:
    driver: bridge